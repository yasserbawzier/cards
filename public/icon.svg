<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="innerCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#10b981" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Main Business Card Shape with Glow -->
  <g filter="url(#glow)">
    <!-- Outer Border -->
    <rect x="76" y="116" width="360" height="280" rx="36" fill="url(#cardGrad)" />
    <!-- Inner Body -->
    <rect x="80" y="120" width="352" height="272" rx="32" fill="url(#innerCard)" />
  </g>

  <!-- Card Chip / Badge -->
  <rect x="116" y="156" width="64" height="48" rx="12" fill="#10b981" opacity="0.2" />
  <rect x="120" y="160" width="56" height="40" rx="10" stroke="#10b981" stroke-width="2.5" fill="none" />
  <circle cx="148" cy="180" r="8" fill="#10b981" />

  <!-- Card Info Lines -->
  <!-- Name Line -->
  <rect x="200" y="162" width="180" height="14" rx="7" fill="#f8fafc" />
  <!-- Title Line -->
  <rect x="200" y="188" width="120" height="10" rx="5" fill="#10b981" />

  <!-- QR / Contact Grid Graphic on Card -->
  <rect x="116" y="240" width="80" height="80" rx="14" fill="#030712" stroke="#334155" stroke-width="2" />
  <!-- QR mini blocks -->
  <rect x="126" y="250" width="24" height="24" rx="4" fill="#10b981" />
  <rect x="162" y="250" width="24" height="24" rx="4" fill="#14b8a6" />
  <rect x="126" y="286" width="24" height="24" rx="4" fill="#14b8a6" />
  <rect x="162" y="286" width="12" height="12" rx="2" fill="#10b981" />

  <!-- Detail Lines -->
  <rect x="220" y="250" width="168" height="10" rx="5" fill="#64748b" />
  <rect x="220" y="275" width="140" height="10" rx="5" fill="#475569" />
  <rect x="220" y="300" width="150" height="10" rx="5" fill="#334155" />

  <!-- Brand Signature Dot -->
  <circle cx="390" cy="355" r="7" fill="#10b981" />
  <circle cx="410" cy="355" r="7" fill="#14b8a6" />
</svg>
